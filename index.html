
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030914">
  <title>مسبحة الاستغفار 🌧️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="rain"></canvas>
  <div class="moon"></div>

  <main class="app" id="main">
    <div class="eyebrow">ذِكْرٌ وَطُمَأْنِينَة</div>
    <h1>أستغفر الله</h1>
    <p class="subtitle">لحظات هادئة مع ذكر الله</p>

    <div class="divider">✦ ───── ✦</div>

    <div class="ring">
      <svg viewBox="0 0 220 220">
        <circle class="track" cx="110" cy="110" r="98"/>
        <circle class="progress" id="progress"
                cx="110" cy="110" r="98"/>
      </svg>
      <div class="number">
        <strong id="count">0</strong>
        <span>من 500</span>
      </div>
    </div>

    <p class="remaining">المتبقي: <span id="remaining">1000</span></p>

    <button id="tap" class="dhikr">
      <span>أستغفر الله </span>
      <small>اضغط للتسبيح</small>
    </button>

    <div class="buttons">
      <button id="sound" class="secondary">🌧️ تشغيل المطر</button>
      <button id="reset" class="secondary">↻ إعادة</button>
    </div>

    <p id="status" class="status">خذ وقتك، واذكر الله بقلب حاضر 🤍</p>
    <footer>اللهم اغفر لنا وارحمنا</footer>
  </main>

  <main id="finish" class="finish hidden">
    <div class="star">✦</div>
    <p class="eyebrow">1000 استغفار</p>
    <h2>تقبّل الله<br>منا ومنكم 🤍</h2>
    <div class="divider">✦ ───── ✦</div>
    <p class="salawat">اللهم صلِّ وسلّم<br>على نبينا محمد ﷺ</p>
    <p class="status">نسأل الله القبول والمغفرة</p>
    <button id="again" class="dhikr">ابدأ من جديد</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
